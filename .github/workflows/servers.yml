name: Auto Servers

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip (if present)
        run: |
          if [ -f alvlirm_vpn_pro.zip ]; then
            mkdir _src
            unzip -q alvlirm_vpn_pro.zip -d _src
            cp -r _src/alvlirm_vpn_pro/. .
            rm -rf _src
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      - name: Harvest, test and publish servers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APP_KEY: ${{ secrets.APP_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: python3 tools/harvest.py
